limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

server {
    listen 80 default_server;

    # Basic auth (create with: htpasswd -c /etc/nginx/.htpasswd username)
    auth_basic "Video Translator";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Upload size limit (match Cloudflare Free tunnel limit)
    client_max_body_size 100m;

    # Timeouts for long-running video processing
    proxy_read_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;

    # Rate limit on upload endpoint
    location /api/translate {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass http://127.0.0.1:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other routes
    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
